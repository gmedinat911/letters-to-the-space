<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afterlight — Letters to the Space</title>
<meta name="description" content="Afterlight — a constellation of reaching and release.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/constellations/afterlight/afterlight.css">
</head>
<body>
<div class="galaxy" aria-hidden="true"></div>
<main class="constellation-shell">
<header>
<a class="back" href="/">← return to the space</a>
<div class="eyebrow">a constellation in the local group</div>
<h1>Afterlight</h1>
<p class="afterlight-line">a constellation of reaching and release.</p>
<p class="afterlight-state">still forming.</p>
</header>
<section class="sky" id="sky" aria-label="Afterlight — an unfinished constellation shaped like an open hand">
<svg class="lines" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">
<!-- wrist into palm -->
<path d="M500 620 L485 515 L500 430"/>
<!-- thumb: the first reach outward -->
<path d="M500 430 L390 455 L285 405"/>
<!-- index finger: the furthest reach -->
<path d="M500 430 L455 340 L430 220 L445 95"/>
<!-- middle finger -->
<path d="M500 430 L520 325 L535 175 L545 62"/>
<!-- ring finger -->
<path d="M500 430 L590 340 L630 215 L650 120"/>
<!-- little finger -->
<path d="M500 430 L665 380 L755 305 L805 235"/>
<!-- soft palm connections -->
<path class="palm-line" d="M390 455 L455 340 L520 325 L590 340 L665 380"/>
</svg>
<!-- These are placeholders only. No letter URLs are attached yet. -->
<div class="star placeholder" style="--x:50%;--y:88%"><span>Ⅰ</span></div>
<div class="star placeholder" style="--x:48.5%;--y:73.5%"><span>Ⅱ</span></div>
<div class="star placeholder" style="--x:39%;--y:58%"><span>Ⅲ</span></div>
<div class="star placeholder" style="--x:28.5%;--y:58%"><span>Ⅳ</span></div>
<div class="star placeholder" style="--x:43%;--y:31.5%"><span>Ⅴ</span></div>
<div class="star placeholder" style="--x:54.5%;--y:9%"><span>Ⅵ</span></div>
<div class="star placeholder" style="--x:65%;--y:17%"><span>Ⅶ</span></div>
<div class="star placeholder" style="--x:44.5%;--y:13.5%"><span>Ⅷ</span></div>
<div class="star placeholder" style="--x:50%;--y:61.5%"><span>Ⅸ</span></div>
<div class="future-stars" aria-hidden="true"><i style="--x:8%;--y:18%"></i><i style="--x:93%;--y:16%"></i><i style="--x:83%;--y:70%"></i><i style="--x:18%;--y:80%"></i></div>
</section>
<p class="note">Some light reaches. Some light returns. None of it disappears.</p>
</main>
<script src="/constellations/afterlight/afterlight.js"></script>
</body></html>
